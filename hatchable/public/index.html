<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<meta name="theme-color" content="#F5F1E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Brickvault">
<meta name="description" content="Brickvault — a premium LEGO portfolio tracker.">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Brickvault — collection portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Geist:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/app.css">
<link rel="icon" type="image/svg+xml" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect x="4" y="4" width="24" height="24" rx="6" fill="%23B5762E"/><circle cx="12" cy="11" r="3" fill="white" opacity="0.6"/><circle cx="20" cy="11" r="3" fill="white" opacity="0.6"/></svg>'>
</head>
<body>

<div id="app">
  <div id="root">
    <div class="page">
      <div class="skel card mb-12" style="height:180px"></div>
      <div class="skel line" style="width:120px;margin-bottom:16px"></div>
      <div class="grid">
        <div class="skel card"></div>
        <div class="skel card"></div>
      </div>
    </div>
  </div>
</div>

<!-- Bottom nav -->
<nav class="bottom-nav" id="nav">
  <a href="#/" class="nav-tab" data-route="/">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13l9-9 9 9M5 11v9a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1v-9"/></svg>
    Portfolio
  </a>
  <a href="#/add" class="nav-tab" data-route="/add">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7" stroke-linecap="round" stroke-linejoin="round"/><path stroke-linecap="round" d="M21 21l-4.35-4.35"/></svg>
    Catalog
  </a>
  <a href="#/pile" class="nav-tab" data-route="/pile">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8.5l9-5 9 5-9 5-9-5zM3 13l9 5 9-5M3 17l9 5 9-5"/></svg>
    Pile
  </a>
  <a href="#/blind" class="nav-tab" data-route="/blind">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M6 7h12l-1 13a2 2 0 01-2 2H9a2 2 0 01-2-2L6 7zM9 7V5a3 3 0 016 0v2"/></svg>
    Blind Bag
  </a>
</nav>

<!-- Pull-to-refresh indicator -->
<div id="ptrIndicator" class="ptr-indicator">
  <div class="ptr-spinner"></div>
  <span>Refreshing…</span>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Camera scan overlay (real getUserMedia) -->
<div id="scanOverlay" class="scan-overlay">
  <video id="scanVideo" autoplay playsinline muted></video>
  <div class="vignette"></div>
  <div class="scan-flash" id="scanFlash"></div>

  <div class="scan-head">
    <div>
      <div class="scan-eyebrow">Scanning</div>
      <div class="scan-title" id="scanTitle">Find a LEGO set</div>
    </div>
    <button class="icon-btn" onclick="window.bv.closeScan()" aria-label="Close">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M6 18L18 6"/></svg>
    </button>
  </div>

  <div class="scan-mode-toggle" id="scanModeToggle">
    <button data-mode="barcode" class="active">Barcode</button>
    <button data-mode="photo">Photo</button>
  </div>

  <div class="scan-frame">
    <div class="scan-target">
      <span class="corner-tl"></span>
      <span class="corner-br"></span>
      <span class="scanline"></span>
    </div>
  </div>

  <div class="scan-hint" id="scanHint">Point at a barcode</div>
  <div class="scan-sub" id="scanSub">Or switch to Photo to identify a built set</div>

  <div class="scan-actions">
    <button class="scan-capture" id="scanCapture" style="display:none" aria-label="Capture photo"></button>
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
