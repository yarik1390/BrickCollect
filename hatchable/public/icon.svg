  <circle cx="168" cy="148" r="18" fill="#D4952E" opacity="0.7"/>
  <circle cx="256" cy="148" r="18" fill="#D4952E" opacity="0.7"/>
  <circle cx="344" cy="148" r="18" fill="#D4952E" opacity="0.7"/>
